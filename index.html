<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bollywood Beats</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      text-align: center;
      padding: 35px 15px;
      background: linear-gradient(135deg, #8e2de2, #ff512f);
    }

    header h1 {
      margin: 0;
      font-size: 38px;
    }

    header p {
      margin: 10px 0 0;
      font-size: 16px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 25px 15px;
    }

    .video {
      background: #1e1e1e;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    }

    .video h2 {
      font-size: 20px;
      margin: 5px 0 15px;
    }

    iframe {
      width: 100%;
      height: 480px;
      border: 0;
      border-radius: 12px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #aaa;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 30px;
      }

      iframe {
        height: 230px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🎵 Bollywood Beats 🎵</h1>
    <p>90s Songs • Bollywood Music • YouTube Collection</p>
  </header>

  <div class="container">

    <div class="video">
      <h2>🎶 Bollywood 90s Song Collection</h2>
      <iframe
        src="https://www.youtube.com/embed/JsT8DsyQxRw"
        allowfullscreen>
      </iframe>
    </div>

    <div class="video">
      <h2>❤️ Happy Marriage Life</h2>
      <iframe
        src="https://www.youtube.com/embed/U1rv3E8Deh8"
        allowfullscreen>
      </iframe>
    </div>

  </div>

  <footer>
    © 2026 Bollywood Beats | YouTube Music Collection
  </footer>

</body>
</html>
